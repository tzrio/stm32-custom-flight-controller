[env:stm32f411ceu6]
platform = ststm32
board = blackpill_f411ce
framework = arduino

; Upload tanpa ST-Link: ROM bootloader STM32 lewat USB DFU.
; Untuk upload, masuk DFU: tahan BOOT0, tekan-lepas NRST, lalu lepas BOOT0.
upload_protocol = dfu

monitor_speed = 115200
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC

[env:stm32f411ceu6_debug]
extends = env:stm32f411ceu6
debug_tool = stlink
debug_init_break = tbreak main

; Hanya untuk instalasi pertama firmware USB CDC. Setelah itu gunakan env utama
; (DFU) dan ST-Link tidak lagi diperlukan untuk upload.
[env:stm32f411ceu6_stlink]
extends = env:stm32f411ceu6
upload_protocol = stlink
